name: Test OTIf pipeline

on:
push:
 branches:[main]
pull_requests:
 branches:[main]

jobs:
test:
runs-on: ubuntu-latest
steps:
 uses: actions/checkout@v3
 uses: actions/setup-python@v4
 with:
  python-version: 3.11
  -run: pip install -r requirement.txt
  -run: python -m unittest discover -s tests
